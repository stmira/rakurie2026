<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | 楽ラック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <div class="login-container">

      <!-- ロゴ -->
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 60 60" aria-hidden="true">
          <rect width="60" height="60" rx="14" fill="#ffe266"/>
          <g fill="#0a80b6">
            <rect x="13" y="17" width="5" height="26" rx="1.5"/>
            <rect x="42" y="17" width="5" height="26" rx="1.5"/>
            <rect x="22" y="23" width="16" height="3.5" rx="1"/>
            <rect x="22" y="33" width="16" height="3.5" rx="1"/>
          </g>
        </svg>
        <span class="logo-text">楽ラック</span>
      </div>

      <form id="loginForm" novalidate>
        <!-- 背番号 -->
        <div class="field">
          <div class="label-row">
            <label for="employeeId">背番号</label>
            <span class="required">必須</span>
          </div>
          <div class="input-wrap">
            <input type="text" id="employeeId" name="employeeId" value=""
                  autocomplete="username" inputmode="numeric" required>
          </div>
        </div>

        <!-- パスワード -->
        <div class="field has-hint">
          <div class="label-row">
            <label for="password">パスワード</label>
            <span class="required">必須</span>
          </div>
          <div class="input-wrap has-toggle">
            <input type="password" id="password" name="password" value=""
                  autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="パスワードを表示する">
              <!-- 目に斜線(非表示中) -->
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a17.6 17.6 0 0 1-2.16 3.19"/>
                <path d="M6.61 6.61A17.3 17.3 0 0 0 2 12s3 8 10 8a9.7 9.7 0 0 0 5.39-1.61"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
              <!-- 目(表示中) -->
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="hint">８文字以上、大文字・小文字を１文字以上含む</p>
          <p class="error-message" id="errorMessage" role="alert"></p>
        </div>

        <!-- ログインボタン -->
        <button type="submit" class="login-button" id="loginButton">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="12" x2="19" y2="12"/>
            <polyline points="13 6 19 12 13 18"/>
          </svg>
          <span>ログイン</span>
        </button>
      </form>

      <a href="#" class="forgot">パスワードを忘れた方はこちら</a>

      <!-- 案内 -->
      <div class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/>
          <line x1="12" y1="11" x2="12" y2="16.5"/>
          <circle cx="12" cy="7.8" r="0.6" fill="currentColor"/>
        </svg>
        <p>初めてご利用の方は、管理者から案内された社員ＩＤと初期パスワードをご使用ください。</p>
      </div>

    </div>
  </main>


</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知 | 楽ラック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="notif" aria-labelledby="notif-title">

    <!-- ===== 上部 ===== -->
    <header class="notif-head">
    <div class="title-row">
        <h1 id="notif-title">通知</h1>
        <span class="badge-unread">未読２件</span>
        <button type="button" class="close" aria-label="通知を閉じる">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
    </div>

    <div class="action-row">
        <button type="button" class="read-all">すべて既読にする</button>
        <button type="button" class="multi">複数選択</button>
        <button type="button" class="more" aria-label="その他の操作">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
    </div>

    <div class="tabs" role="tablist">
        <button type="button" class="tab is-active" role="tab" aria-selected="true">すべて</button>
        <button type="button" class="tab" role="tab" aria-selected="false">未読</button>
        <button type="button" class="tab" role="tab" aria-selected="false">重要</button>
    </div>
    </header>

    <!-- ===== 通知一覧 ===== -->
    <ul class="list">

    <li>
        <a href="#" class="item is-unread">
        <span class="meta">
            <i class="dot" aria-hidden="true"></i>
            <time>10月9日（金）14:40</time>
        </span>
        <span class="main">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 3l2 2-8 8-2-2z"/><path d="M10.5 11.5C8 11 5.5 12.5 5.5 15c0 1.5-1 2.5-2.5 3 3 1.5 8 1 9-3 .3-1.2-.2-2.2-1.5-3.5z"/></svg>
            <span class="texts"><strong>パワーラックの色変更</strong><small>T社</small></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
        <span class="body">塗装色が変更されました。工程表を確認してください。</span>
        </a>
    </li>

    <li>
        <a href="#" class="item is-unread">
        <span class="meta">
            <i class="dot" aria-hidden="true"></i>
            <time>10月8日（木）9:00</time>
            <span class="important">重要</span>
        </span>
        <span class="main">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4h13v12H1z"/><path d="M14 8h4.5L22 12v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/></svg>
            <span class="texts"><strong>パワーラックの納期</strong><small>N社</small></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
        <span class="body">出荷日が近づいています。出荷準備の状況をご確認ください。</span>
        </a>
    </li>

    <li>
        <a href="#" class="item">
        <span class="meta"><time>10月7日（水）9:00</time></span>
        <span class="main">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="15" r=".6"/><circle cx="12" cy="15" r=".6"/><circle cx="16" cy="15" r=".6"/></svg>
            <span class="texts"><strong>Ｉさんの有給</strong><small>勤怠のお知らせ</small></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
        <span class="body">９:00〜16:00 は有給です。担当者の予定を確認してください。</span>
        </a>
    </li>

    <li>
        <a href="#" class="item">
        <span class="meta"><time>10月5日（月）10:00</time></span>
        <span class="main">
            <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 3l2 2-8 8-2-2z"/><path d="M10.5 11.5C8 11 5.5 12.5 5.5 15c0 1.5-1 2.5-2.5 3 3 1.5 8 1 9-3 .3-1.2-.2-2.2-1.5-3.5z"/></svg>
            <span class="texts"><strong>パワーラックの色変更</strong><small>Q社</small></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
        <span class="body">変更内容は早見表から確認できます。</span>
        </a>
    </li>

    </ul>

    <!-- ===== 下部の案内 ===== -->
    <p class="foot">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r=".6"/></svg>
    通知を選ぶと、関連する工程表や早見表を確認できます。
    </p>

</aside>

</body>
</html>
